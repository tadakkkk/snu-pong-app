name: Enrich Crawled Data
on:
  push:
    paths:
      - 'src/data/crawled/*.sql'
      - 'src/data/crawled-items.json'
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openai
      - run: python scripts/enrich-crawled-data.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/enriched-items.json
          git diff --cached --quiet || git commit -m "Auto-enrich crawled data"
          git push
