name: Daily Crawl

on:
  schedule:
    # Daily 5AM KST = UTC 20:00 (previous day)
    - cron: '0 20 * * *'
  workflow_dispatch:  # manual run

permissions:
  contents: write   # enriched-items.json 커밋/푸시
  issues: write     # 크롤 실패 시 알림 이슈 생성

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: src/server
        run: |
          pip install -r requirements.txt

      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is missing"; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret is missing"; exit 1; }

      - name: Run daily crawl + enrich + export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INCLUDE_DEPARTMENTS: 'true'
          MAX_PER_DEPT: '3'
          RETRY_FAILED_ENRICHMENT: 'true'
          MAX_RETRY_FAILED: '200'
        working-directory: src/server
        run: python daily_crawl.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/enriched-items.json
          if git diff --staged --quiet; then
            echo "No changes - skip commit"
          else
            SUMMARY=$(cat src/server/crawl_summary.txt 2>/dev/null || echo "data update")
            git commit -m "chore: daily crawl ($SUMMARY)"
            # push 전 최신 반영 (충돌 방지), 실패 시 재시도
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push attempt $i failed, retrying..."
              sleep 5
            done
          fi

      # 크롤/정제/DB 저장 중 하나라도 실패하면 조용히 넘어가지 않고 이슈로 알린다.
      # (DB 다운·커넥션 끊김 등을 며칠씩 못 보고 지나치는 상황 방지)
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = `⚠️ Daily Crawl 실패 (${new Date().toISOString().slice(0,10)})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '일일 크롤이 실패했어요. DB(Neon/Supabase) 다운·커넥션 끊김·API 오류 등을 확인하세요.',
              '',
              `- 실행 로그: ${runUrl}`,
              `- 커밋: ${context.sha}`,
              '',
              '해결 후 Actions 탭에서 **Re-run** 하면 됩니다.'
            ].join('\n');
            // 같은 열린 이슈가 있으면 코멘트만, 없으면 새로 생성
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'crawl-failure'
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['crawl-failure']
              });
            }
